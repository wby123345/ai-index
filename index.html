<style>
  :root {
    --bg: #0b0b0e;
    --surface: #141418;

    --border: #25252d;
    --text: #e4e4ec;
    --text2: #9e9eae;
    --accent: #a78bfa;
    --accent2: #6366f1;
    --tag-bg: #1e1b2e;
    --tag-text: #c4b5fd;
    --featured-glow: rgba(99,102,241,0.12);

  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,11,14,0.85); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
  }
  .logo {
    font-size: 1.1rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-stats { font-size: 0.8rem; color: var(--text2); }
  .header-ad-link {
    font-size: 0.78rem; color: var(--text2);
    text-decoration: none; padding: 5px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    transition: all 0.2s;
  }
  .header-ad-link:hover { border-color: var(--sponsor); color: var(--sponsor); }

  /* Hero */
  .hero {
    text-align: center; padding: 64px 24px 48px;
  }
  .hero h1 {
    font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em;
    margin-bottom: 12px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p { color: var(--text2); font-size: 1.05rem; max-width: 480px; margin: 0 auto 32px; }

  /* Search */
  .search-wrap {
    max-width: 520px; margin: 0 auto; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 14px 48px 14px 20px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent2); }
  .search-wrap input::placeholder { color: #555; }
  .search-icon {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    color: #555; pointer-events: none;
  }

  /* Categories */
  .categories {
    display: flex; flex-wrap: wrap; gap: 8px;
    max-width: 1280px; margin: 0 auto 24px; padding: 0 24px;
    justify-content: center;
  }
  .cat-btn {
    padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .cat-btn:hover { border-color: var(--accent2); color: var(--text); }
  .cat-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  /* Featured section */
  .featured-section { display: none; }
  .featured-section.has-featured {
    display: block;
    max-width: 1280px; margin: 0 auto 8px; padding: 0 24px;
  }
  .section-label {
    font-size: 0.78rem; font-weight: 600; color: var(--sponsor);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 12px; padding-left: 4px;
  }

  /* Grid */
  .grid {
    max-width: 1280px; margin: 0 auto; padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .grid-divider {
    grid-column: 1 / -1; margin: 16px 0 8px;
    height: 1px; background: var(--border);
  }

  /* Card */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 22px;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    cursor: pointer; position: relative;
  }
  .card:hover {
    border-color: var(--accent2);
    transform: translateY(-1px);
  }
  .card.featured {
    border-color: rgba(245,158,11,0.25);
    box-shadow: 0 0 20px var(--featured-glow);
  }
  .card.featured:hover { border-color: var(--sponsor); }
  .card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
  .card-icon {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 700;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-info h3 {
    font-size: 0.95rem; font-weight: 600; margin-bottom: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-info h3 a {
    color: var(--text); text-decoration: none;
  }
  .card-info h3 a:hover { color: var(--accent); }
  .card-info .domain {
    font-size: 0.78rem; color: var(--text2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-desc {
    font-size: 0.84rem; color: var(--text2); line-height: 1.5;
    margin-bottom: 12px; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    padding: 3px 10px; border-radius: 6px;
    background: var(--tag-bg); color: var(--tag-text);
    font-size: 0.72rem; font-weight: 500;
  }

  /* Sponsor badge */
  .sponsor-badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    background: rgba(245,158,11,0.15); color: var(--sponsor);
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .affiliate-tag {
    background: rgba(245,158,11,0.12) !important; color: var(--sponsor) !important;
  }

  /* Clicks counter */
  .click-count {
    font-size: 0.7rem; color: var(--text2); margin-left: auto;
    display: flex; align-items: center; gap: 4px; opacity: 0.7;
  }

  /* Footer */
  footer {
    max-width: 1280px; margin: 0 auto; padding: 40px 24px;
    border-top: 1px solid var(--border); text-align: center;
  }
  footer p { font-size: 0.8rem; color: var(--text2); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Empty */
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 64px 24px;
    color: var(--text2);
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

  @media (max-width: 640px) {
    .hero h1 { font-size: 1.8rem; }
    .hero { padding: 40px 16px 32px; }
    .grid { grid-template-columns: 1fr; padding: 0 16px 60px; }
    .categories { padding: 0 16px; }
    .header-ad-link { display: none; }
    .section-label { padding-left: 0; }
    footer { padding: 32px 16px; }
    footer > div { flex-direction: column; gap: 24px; }
    .featured-section.has-featured { padding: 0 16px; }
  }
</style>

function getClicks() {
  try { return JSON.parse(localStorage.getItem(CLICKS_KEY) || "{}"); }
  catch { return {}; }
}
function recordClick(name) {
  const clicks = getClicks();
  clicks[name] = (clicks[name] || 0) + 1;
  localStorage.setItem(CLICKS_KEY, JSON.stringify(clicks));
}
function getClickCount(name) {
  return getClicks()[name] || 0;
}

// ============================================================
// RESOLVE URL (affiliate > sponsored tracking > original)
// ============================================================
function resolveUrl(tool) {
  if (AFFILIATES[tool.name]) return AFFILIATES[tool.name];
  return tool.url;
}

// ============================================================
// RENDER
// ============================================================
let activeCat = "全部";
let searchQuery = "";
const cats = ["全部", ...new Set(TOOLS.map(t => t.cat))];

function init() {
  renderCategories();
  renderAll();
  bindEvents();
  updateStats();
}

function renderCategories() {
  const el = document.getElementById("categories");
  el.innerHTML = cats.map(c =>
    `<button class="cat-btn${c === activeCat ? ' active' : ''}" data-cat="${c}">${c}</button>`
  ).join("");
}

function filterTools() {
  return TOOLS.filter(t => {
    if (activeCat !== "全部" && t.cat !== activeCat) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return t.name.toLowerCase().includes(q) ||
             t.desc.toLowerCase().includes(q) ||
             t.cat.toLowerCase().includes(q);
    }
    return true;
  });
}

function renderAll() {
  const filtered = filterTools();
  const featured = filtered.filter(t => t.featured);
  const regular = filtered.filter(t => !t.featured);

  // Featured grid
  const fSection = document.getElementById("featuredSection");
  const fGrid = document.getElementById("featuredGrid");
  if (featured.length > 0 && activeCat === "全部" && !searchQuery) {
    fSection.classList.add("has-featured");
    fGrid.innerHTML = featured.map(t => buildCard(t, true)).join("");
    fGrid.style.display = "grid";
  } else {
    fSection.classList.remove("has-featured");
    fGrid.innerHTML = "";
    fGrid.style.display = "none";
  }

  // Main grid
  const grid = document.getElementById("grid");
  const showFeaturedInMain = activeCat !== "全部" || !!searchQuery;
  const mainTools = showFeaturedInMain ? filtered : regular;

  if (mainTools.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="icon">🔍</div><p>没找到匹配的工具，换个关键词试试？</p></div>`;
  } else {
    const showDivider = !showFeaturedInMain && featured.length > 0 && regular.length > 0 && activeCat === "全部" && !searchQuery;
    grid.innerHTML = (showDivider ? '<div class="grid-divider"></div>' : '') +
      mainTools.map(t => buildCard(t, false)).join("");
  }

  updateStats(filtered.length);
}

function buildCard(t, isFeatured) {
  const initials = t.name.slice(0, 2).toUpperCase();
  const finalUrl = resolveUrl(t);
  const hasAffiliate = !!AFFILIATES[t.name];
  const isSponsored = SPONSORED.has(t.name);
  const clicks = getClickCount(t.name);

  const featuredClass = isFeatured ? " featured" : "";
  const sponsorBadge = isSponsored
    ? '<span class="sponsor-badge">赞助</span>'
    : (isFeatured ? '<span class="sponsor-badge">推荐</span>' : "");

  const tagClass = hasAffiliate ? " tag affiliate-tag" : " tag";
  const affix = hasAffiliate ? " 🔗" : "";

  const clickInfo = clicks > 0
    ? `<span class="click-count" title="${clicks} 次点击">${clicks}</span>`
    : "";

  return `
  <div class="card${featuredClass}" data-tool="${t.name}" data-url="${finalUrl}">
    <div class="card-top">
      <div class="card-icon" style="background:${t.color};color:#fff">${initials}</div>
      <div class="card-info">
        <h3>
          <a href="${finalUrl}" target="_blank" rel="noopener">${t.name}</a>
          ${sponsorBadge}
          ${clickInfo}
        </h3>
        <div class="domain">${new URL(t.url).hostname}</div>
      </div>
    </div>
    <p class="card-desc">${t.desc}</p>
    <div class="card-tags">
      <span class="${tagClass}">${t.cat}${affix}</span>
    </div>
  </div>`;
}

function updateStats(count) {
  const shown = count ?? TOOLS.length;
  document.getElementById("headerStats").textContent = `${shown} / ${TOOLS.length} 个工具`;
}

// ============================================================
// EVENTS
// ============================================================
function bindEvents() {
  document.getElementById("categories").addEventListener("click", e => {
    if (e.target.classList.contains("cat-btn")) {
      activeCat = e.target.dataset.cat;
      renderCategories();
      renderAll();
    }
  });

  let debounce;
  document.getElementById("search").addEventListener("input", e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      searchQuery = e.target.value.trim();
      renderAll();
    }, 200);
  });

  // Click tracking on cards
  document.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    // Don't double-count if user clicked the <a> directly
    if (e.target.closest("a")) return;
    const toolName = card.dataset.tool;
    const url = card.dataset.url;
    if (toolName && url) {
      recordClick(toolName);
      window.open(url, "_blank", "noopener");
    }
  });

  // Track clicks on <a> links too
  document.addEventListener("click", e => {
    const a = e.target.closest("a");
    if (!a) return;
    const card = a.closest(".card");
    if (!card) return;
    const toolName = card.dataset.tool;
    if (toolName) recordClick(toolName);
  });
}

init();
